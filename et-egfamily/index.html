<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Word Family Balloon Buckets</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f7f2ff;
    overflow:hidden;
    width:100vw;
    height:100vh;
}

/* SCREENS */

.screen{
    display:none;
    width:100%;
    height:100vh;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.active{
    display:flex;
}

/* INTRO */

#intro{
    background:#f7f2ff;
}

#intro img{
    width:180px;
    max-width:60%;
}

/* TOP BAR */

.top-bar{
    width:100%;
    background:#d9c8f3;
    color:#333;
    text-align:center;
    padding:10px 8px;
    font-size:15px;
    font-weight:bold;
    line-height:1.3;
    flex-shrink:0;
}

/* GAME */

#game{
    justify-content:flex-start;
}

.game-content{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:5px 0;
}

/* BALLOON SECTION */

.balloon-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:5px;
    animation:floatDown 2s ease-out;
}

@keyframes floatDown{

    from{
        transform:translateY(-50px);
        opacity:0;
    }

    to{
        transform:translateY(0px);
        opacity:1;
    }
}

/* BALLOON */

.balloon{
    width:120px;
    height:150px;
    border-radius:50%;
    border:5px solid #888;
    background:white;
    position:relative;
    transition:0.4s;
}

.balloon::after{
    content:'';
    width:4px;
    height:45px;
    background:#777;
    position:absolute;
    left:50%;
    bottom:-45px;
    transform:translateX(-50%);
}

/* WORD CARD */

.word-card{
    margin-top:48px;
    width:170px;
    background:white;
    border-radius:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
    padding:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.word-card img{
    width:85px;
    height:85px;
    object-fit:contain;
}

.word-text{
    font-size:30px;
    font-weight:bold;
    color:#444;
    margin-top:4px;
}

/* FEEDBACK */

.feedback{
    height:50px;
    font-size:44px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* BUCKET AREA */

.bucket-row{
    width:100%;
    display:flex;
    justify-content:space-evenly;
    align-items:flex-end;
    padding:0 4px 8px 4px;
    gap:4px;
    flex-shrink:0;
}

/* BUCKETS */

.bucket{
    flex:1;
    max-width:24%;
    min-width:68px;
    height:120px;
    position:relative;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

/* BUCKET IMAGES */

.bucket img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* LABEL */

.bucket-label{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:1px 1px 2px rgba(0,0,0,0.4);
    pointer-events:none;
}

/* END SCREEN */

#end{
    background:#f7f2ff;
    text-align:center;
}

#end h1{
    color:#7b1fa2;
    margin-bottom:10px;
}

#scoreText{
    font-size:30px;
    margin-bottom:20px;
}

.replay-btn{
    padding:14px 28px;
    border:none;
    border-radius:18px;
    background:#ffb74d;
    font-size:22px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

    .top-bar{
        font-size:12px;
        padding:8px 5px;
    }

    .balloon{
        width:100px;
        height:130px;
    }

    .balloon::after{
        height:35px;
        bottom:-35px;
    }

    .word-card{
        width:145px;
        margin-top:38px;
    }

    .word-card img{
        width:65px;
        height:65px;
    }

    .word-text{
        font-size:24px;
    }

    .feedback{
        font-size:38px;
        height:42px;
    }

    .bucket{
        height:92px;
        min-width:60px;
    }

    .bucket-label{
        font-size:14px;
        bottom:10px;
    }

    #scoreText{
        font-size:24px;
    }

    .replay-btn{
        font-size:18px;
        padding:12px 24px;
    }
}

</style>
</head>

<body>

<!-- INTRO -->

<div id="intro" class="screen active">

    <img src="assets/innovine-logo.png">

</div>

<!-- GAME -->

<div id="game" class="screen">

    <div class="top-bar">
        Read the words that appear with the balloon outline and colour the balloon as per the colour code in the colour buckets.
    </div>

    <div class="game-content">

        <!-- BALLOON -->

        <div class="balloon-wrapper">

            <div id="balloon" class="balloon"></div>

            <div class="word-card">

                <img id="wordImage" src="">

                <div id="wordText" class="word-text"></div>

            </div>

        </div>

        <!-- FEEDBACK -->

        <div id="feedback" class="feedback"></div>

        <!-- BUCKETS -->

        <div class="bucket-row">

            <div class="bucket" onclick="checkAnswer('et')">

                <img src="assets/red-bucket.png">

                <div class="bucket-label">-et</div>

            </div>

            <div class="bucket" onclick="checkAnswer('eg')">

                <img src="assets/blue-bucket.png">

                <div class="bucket-label">-eg</div>

            </div>

            <div class="bucket" onclick="checkAnswer('en')">

                <img src="assets/green-bucket.png">

                <div class="bucket-label">-en</div>

            </div>

            <div class="bucket" onclick="checkAnswer('ed')">

                <img src="assets/purple-bucket.png">

                <div class="bucket-label">-ed</div>

            </div>

        </div>

    </div>

</div>

<!-- END -->

<div id="end" class="screen">

    <h1>🎉 Great Job!</h1>

    <div id="scoreText"></div>

    <button class="replay-btn" onclick="restartGame()">
        🔄 Replay
    </button>

</div>

<!-- AUDIO -->

<audio id="correctSound" src="assets/correct.mp3"></audio>

<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<audio id="bgMusic" src="assets/background-music.mp3" loop></audio>

<script>

// QUESTIONS

const questions = [

{word:"jet", family:"et", img:"assets/jet.png"},
{word:"net", family:"et", img:"assets/net.png"},
{word:"pet", family:"et", img:"assets/pet.png"},
{word:"wet", family:"et", img:"assets/wet.png"},

{word:"leg", family:"eg", img:"assets/leg.png"},
{word:"peg", family:"eg", img:"assets/peg.png"},
{word:"egg", family:"eg", img:"assets/egg.png"},
{word:"beg", family:"eg", img:"assets/beg.png"},

{word:"hen", family:"en", img:"assets/hen.png"},
{word:"pen", family:"en", img:"assets/pen.png"},
{word:"ten", family:"en", img:"assets/ten.png"},
{word:"den", family:"en", img:"assets/den.png"},

{word:"bed", family:"ed", img:"assets/bed.png"},
{word:"shed", family:"ed", img:"assets/shed.png"},
{word:"wed", family:"ed", img:"assets/wed.png"},
{word:"red", family:"ed", img:"assets/red.png"}

];

// SHUFFLE

questions.sort(()=>Math.random()-0.5);

let current = 0;
let score = 0;
let locked = false;

// SPEAK

function speak(text, rate=0.8){

    let msg = new SpeechSynthesisUtterance(text);

    msg.rate = rate;

    speechSynthesis.speak(msg);
}

// START GAME

setTimeout(()=>{

    document.getElementById("intro").classList.remove("active");

    document.getElementById("game").classList.add("active");

    speak("Look at the word and picture tied to the balloon. Tap the correct colour bucket.");

    setTimeout(()=>{

        let music = document.getElementById("bgMusic");

        music.volume = 0.2;

        music.play().catch(()=>{});

        loadQuestion();

    },4000);

},5000);

// LOAD QUESTION

function loadQuestion(){

    locked = false;

    let q = questions[current];

    document.getElementById("wordText").innerText = q.word;

    document.getElementById("wordImage").src = q.img;

    document.getElementById("feedback").innerText = "";

    document.getElementById("balloon").style.background = "white";

    speak(q.word);
}

// CHECK ANSWER

function checkAnswer(answer){

    if(locked) return;

    let q = questions[current];

    let balloon = document.getElementById("balloon");

    let feedback = document.getElementById("feedback");

    if(answer === q.family){

        locked = true;

        score++;

        document.getElementById("correctSound").play();

        feedback.innerText = "👏";

        if(answer === "et"){
            balloon.style.background = "#e57373";
        }

        if(answer === "eg"){
            balloon.style.background = "#64b5f6";
        }

        if(answer === "en"){
            balloon.style.background = "#81c784";
        }

        if(answer === "ed"){
            balloon.style.background = "#9575cd";
        }

        setTimeout(()=>{

            current++;

            if(current < questions.length){

                loadQuestion();

            }else{

                showEnd();
            }

        },1500);

    }else{

        document.getElementById("wrongSound").play();

        feedback.innerText = "❌";

        setTimeout(()=>{
            feedback.innerText = "";
        },1000);
    }
}

// END SCREEN

function showEnd(){

    document.getElementById("game").classList.remove("active");

    document.getElementById("end").classList.add("active");

    document.getElementById("scoreText").innerText =
    "⭐ Score: " + score + " / " + questions.length;
}

// REPLAY

function restartGame(){

    current = 0;

    score = 0;

    questions.sort(()=>Math.random()-0.5);

    document.getElementById("end").classList.remove("active");

    document.getElementById("game").classList.add("active");

    loadQuestion();
}

</script>

</body>
</html>
