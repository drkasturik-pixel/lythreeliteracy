<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Word Family Balloon Crayons</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f7f2ff;
    overflow:hidden;
}

/* Screens */
.screen{
    display:none;
    width:100%;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.active{ display:flex; }

/* Intro */
#intro img{ width:180px; }

/* Top bar */
.top-bar{
    width:100%;
    background:#d9c8f3;
    padding:10px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
}

/* Game layout */
.game-content{
    width:100%;
    height:calc(100vh - 50px);
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* Balloon */
.balloon{
    width:130px;
    height:160px;
    border-radius:50%;
    border:5px solid #888;
    margin-top:10px;
}

/* Word card */
.word-card{
    margin-top:20px;
    width:170px;
    background:white;
    border-radius:15px;
    text-align:center;
    padding:10px;
}

.word-card img{
    width:80px;
}

.word-text{
    font-size:28px;
    font-weight:bold;
}

/* Crayons */
.crayon-row{
    width:100%;
    display:flex;
    justify-content:space-around;
    position:absolute;
    bottom:0;
}

.crayon{
    width:23%;
    position:relative;
    cursor:pointer;
}

.crayon img{
    width:100%;
}

.crayon-label{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-weight:bold;
}

/* Feedback */
#feedback{
    font-size:40px;
    margin-top:10px;
}

/* End */
#end h1{ color:#7b1fa2; }
.replay-btn{
    padding:12px;
    font-size:18px;
    background:#ffb74d;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="game" class="screen">

<div class="top-bar">
Read the words and tap the correct crayon.
</div>

<div class="game-content">

<div id="balloon" class="balloon"></div>

<div class="word-card">
<img id="wordImage">
<div id="wordText" class="word-text"></div>
</div>

<div id="feedback"></div>

<img id="confetti" src="assets/confetti.gif"
style="display:none;position:absolute;top:40%;width:150px;">

<div class="crayon-row">

<div class="crayon" onclick="checkAnswer('et')">
<img src="assets/redcrayon.png">
<div class="crayon-label">-et</div>
</div>

<div class="crayon" onclick="checkAnswer('eg')">
<img src="assets/bluecrayon.png">
<div class="crayon-label">-eg</div>
</div>

<div class="crayon" onclick="checkAnswer('en')">
<img src="assets/greencrayon.png">
<div class="crayon-label">-en</div>
</div>

<div class="crayon" onclick="checkAnswer('ed')">
<img src="assets/yellowcrayon.png">
<div class="crayon-label">-ed</div>
</div>

</div>

</div>
</div>

<!-- END -->
<div id="end" class="screen">
<h1>🎉 Great Job!</h1>
<div id="scoreText"></div>
<button class="replay-btn" onclick="restartGame()">Replay</button>
</div>

<!-- AUDIO -->
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="bgMusic" src="assets/background-music.mp3" loop></audio>

<script>

/* QUESTIONS (fixed) */
const questions = [
{word:"jet", family:"et", img:"assets/jet.png"},
{word:"net", family:"et", img:"assets/net.png"},
{word:"pet", family:"et", img:"assets/pet.png"},
{word:"wet", family:"et", img:"assets/wet.png"},

{word:"leg", family:"eg", img:"assets/leg.png"},
{word:"peg", family:"eg", img:"assets/peg.png"},
{word:"beg", family:"eg", img:"assets/beg.png"},

{word:"hen", family:"en", img:"assets/hen.png"},
{word:"pen", family:"en", img:"assets/pen.png"},
{word:"ten", family:"en", img:"assets/ten.png"},
{word:"den", family:"en", img:"assets/den.png"},

{word:"bed", family:"ed", img:"assets/bed.png"},
{word:"red", family:"ed", img:"assets/red.png"}
];

questions.sort(()=>Math.random()-0.5);

let current=0;
let score=0;
let locked=false;

/* Speech */
function speak(text){
let msg=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(msg);
}

/* Start */
setTimeout(()=>{
document.getElementById("intro").classList.remove("active");
document.getElementById("game").classList.add("active");

speak("Look at the word and picture. Tap the correct crayon.");

setTimeout(()=>{
document.getElementById("bgMusic").volume=0.2;
document.getElementById("bgMusic").play().catch(()=>{});
loadQuestion();
},3000);

},5000);

/* Load */
function loadQuestion(){
locked=false;
let q=questions[current];
wordText.innerText=q.word;
wordImage.src=q.img;
feedback.innerText="";
balloon.style.background="white";
speak(q.word);
}

/* Check */
function checkAnswer(ans){
if(locked) return;
let q=questions[current];

if(ans===q.family){
locked=true;
score++;

confetti.style.display="block";
feedback.innerText="✅";

setTimeout(()=>{
confetti.style.display="none";
current++;
if(current<questions.length){
loadQuestion();
}else{
showEnd();
}
},1500);

}else{
wrongSound.play();
feedback.innerText="❌";
setTimeout(()=>{feedback.innerText="";},1000);
}
}

/* End */
function showEnd(){
game.classList.remove("active");
end.classList.add("active");
scoreText.innerText="Score: "+score+"/"+questions.length;
}

/* Replay */
function restartGame(){
current=0;
score=0;
questions.sort(()=>Math.random()-0.5);
end.classList.remove("active");
game.classList.add("active");
loadQuestion();
}

</script>

</body>
</html>
