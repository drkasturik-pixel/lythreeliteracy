<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Word Family Balloon Crayons</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    font-family:Arial, sans-serif;
    background:#f7f2ff;
    overflow:hidden;
    width:100vw;
    height:100vh;
}

/* SCREENS */

.screen{
    display:none;
    width:100%;
    height:100vh;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.active{
    display:flex;
}

/* INTRO */

#intro{
    background:#f7f2ff;
}

#intro img{
    width:180px;
    max-width:70%;
}

/* TOP BAR */

.top-bar{
    width:100%;
    background:#d9c8f3;
    color:#333;
    text-align:center;
    padding:10px 8px;
    font-size:14px;
    font-weight:bold;
    line-height:1.4;
}

/* GAME */

#game{
    justify-content:flex-start;
}

.game-content{
    width:100%;
    height:calc(100vh - 55px);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
}

/* BALLOON */

.balloon-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:5px;
    animation:floatDown 2s ease-out;
    transform:scale(0.82);
    transform-origin:top center;
}

@keyframes floatDown{

    from{
        transform:translateY(-60px) scale(0.82);
        opacity:0;
    }

    to{
        transform:translateY(0px) scale(0.82);
        opacity:1;
    }
}

.balloon{
    width:130px;
    height:160px;
    border-radius:50%;
    border:5px solid #888;
    background:white;
    position:relative;
    transition:0.4s;
}

.balloon::after{
    content:'';
    width:4px;
    height:45px;
    background:#777;
    position:absolute;
    left:50%;
    bottom:-45px;
    transform:translateX(-50%);
}

/* WORD CARD */

.word-card{
    margin-top:48px;
    width:180px;
    background:white;
    border-radius:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
    padding:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.word-card img{
    width:90px;
    height:90px;
    object-fit:contain;
}

.word-text{
    font-size:30px;
    font-weight:bold;
    color:#444;
    margin-top:5px;
}

/* FEEDBACK */

.feedback{
    height:45px;
    font-size:42px;
    margin-top:5px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CRAYON ROW */

.crayon-row{
    width:100%;
    height:145px;
    display:flex;
    justify-content:space-evenly;
    align-items:flex-end;
    position:absolute;
    bottom:0;
    left:0;
    padding:0 2px 5px 2px;
}

/* CRAYONS */

.crayon{
    width:24%;
    height:135px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    cursor:pointer;
}

.crayon img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.crayon-label{
    position:absolute;
    top:48%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:18px;
    font-weight:900;
    color:#0d1b4c;
    text-shadow:1px 1px 2px rgba(255,255,255,0.9);
    pointer-events:none;
}

/* END SCREEN */

#end{
    text-align:center;
}

#end h1{
    color:#7b1fa2;
    margin-bottom:10px;
}

#scoreText{
    font-size:30px;
    margin-bottom:20px;
}

.replay-btn{
    padding:14px 28px;
    border:none;
    border-radius:18px;
    background:#ffb74d;
    font-size:22px;
    cursor:pointer;
}

.stars{
    font-size:30px;
    animation:twinkle 1s infinite alternate;
    margin-bottom:15px;
}

@keyframes twinkle{
    from{
        transform:scale(1);
        opacity:0.8;
    }
    to{
        transform:scale(1.1);
        opacity:1;
    }
}

</style>
</head>

<body>

<div id="intro" class="screen active">
    <img src="assets/innovine-logo.png">
</div>

<div id="game" class="screen">

<div class="top-bar">
Read the words that appear with the balloon outline and colour the balloon as per the colour code of the crayons.
</div>

<div class="game-content">

<div class="balloon-wrapper">

<div id="balloon" class="balloon"></div>

<div class="word-card">
<img id="wordImage">
<div id="wordText" class="word-text"></div>
</div>

</div>

<div id="feedback" class="feedback"></div>

<img id="confetti" src="assets/confetti.gif"
style="display:none;width:180px;position:absolute;top:35%;left:50%;transform:translateX(-50%);">

<div class="crayon-row">

<div class="crayon" onclick="checkAnswer('et')">
<img src="assets/redcrayon.png">
<div class="crayon-label">-et</div>
</div>

<div class="crayon" onclick="checkAnswer('eg')">
<img src="assets/bluecrayon.png">
<div class="crayon-label">-eg</div>
</div>

<div class="crayon" onclick="checkAnswer('en')">
<img src="assets/greencrayon.png">
<div class="crayon-label">-en</div>
</div>

<div class="crayon" onclick="checkAnswer('ed')">
<img src="assets/yellowcrayon.png">
<div class="crayon-label">-ed</div>
</div>

</div>

</div>
</div>

<div id="end" class="screen">
<div class="stars">⭐ ⭐ ⭐</div>
<h1>🎉 Great Job!</h1>
<div id="scoreText"></div>
<button class="replay-btn" onclick="restartGame()">🔄 Replay</button>
